name: Documentation Quality Check

on:
  push:
    branches: [ main, develop ]
    paths: [ 'docs/**', 'mkdocs.yml', 'overrides/**', '.github/workflows/quality-check.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'docs/**', 'mkdocs.yml', 'overrides/**', '.github/workflows/quality-check.yml' ]

permissions:
  contents: read

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material mkdocs-git-revision-date-localized-plugin mkdocs-minify-plugin

      - name: Reject trailing whitespace
        run: |
          if grep -RInE '[[:blank:]]+$' docs --include='*.md'; then
            echo 'Trailing whitespace found in documentation.' >&2
            exit 1
          fi

      - name: Build documentation
        run: mkdocs build

      - name: Upload built documentation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-check-site
          path: site/
          if-no-files-found: ignore
          retention-days: 7
